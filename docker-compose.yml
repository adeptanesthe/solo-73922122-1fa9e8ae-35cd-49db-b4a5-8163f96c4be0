services:
  crack-tiling:
    build: .
    image: crack-tiling:latest
    container_name: crack-tiling
    ports:
      - "8000:8000"
    environment:
      # 修正后通过复查的权重 JSON 落盘目录（命名卷持久化）
      REFINE_DATA_DIR: /data
    volumes:
      - refine_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  refine_data:
